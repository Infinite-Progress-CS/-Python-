<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>蟒蛇老师教Python</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/python.min.js"></script>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="app-layout">

<!-- ======== 左侧边栏 ======== -->
<aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
        <div class="sidebar-logo" id="sidebarLogo"></div>
        <div class="sidebar-title" id="sidebarUsername">蟒蛇老师</div>
        <div class="sidebar-sub">Python 编程教学</div>
    </div>

    <!-- 新建对话按钮 -->
    <button class="new-chat-btn" onclick="newConversation()">+ 新建对话</button>

    <!-- 历史会话列表 -->
    <div class="sidebar-section">
        <div class="section-label">历史对话</div>
        <div class="conv-list" id="convList">
            <div class="topic-item loading">加载中...</div>
        </div>
    </div>

    <!-- 学习路线 -->
    <div class="sidebar-section">
        <div class="section-label">学习路线</div>
        <div class="topic-list" id="topicList"></div>
    </div>

    <div class="sidebar-footer">
        <button class="side-btn" onclick="location.href='/practice'">编程刷题</button>
        <button class="side-btn" onclick="location.href='/profile'">个人中心</button>
        <button class="side-btn" onclick="localStorage.clear();location.href='/'">退出登录</button>
        <span class="api-badge">DeepSeek-V3</span>

</aside>

<!-- ======== 主聊天区 ======== -->
<main class="main-chat">
    <header class="topbar">
        <button class="menu-toggle" onclick="toggleSidebar()" title="侧边栏">|||</button>
        <h1 class="topbar-title">蟒蛇老师教Python</h1>
        <span class="topbar-status" id="topStatus">就绪</span>
    </header>

    <div class="chat-area" id="chatContainer">
        <div class="welcome-card">
            <div class="welcome-icon" id="welcomeIcon"></div>
            <h2>你好！我是蟒蛇老师</h2>
            <p>你的专属 Python 编程教练，从零基础到进阶实战</p>
            <div class="welcome-actions">
                <span onclick="sendPreset('Python应该怎么安装？写第一个Hello World')">入门第一课</span>
                <span onclick="sendPreset('什么是变量？Python有哪些数据类型？')">变量和类型</span>
                <span onclick="sendPreset('带我写一个猜数字小游戏')">实战小游戏</span>
            </div>
        </div>
    </div>

    <div class="input-area">
        <button class="emoji-toggle" id="emojiBtn" onclick="toggleEmoji()" title="表情">😊</button>
        <input type="text" id="messageInput" class="msg-input"
               placeholder="输入Python相关问题，按Enter发送..." autocomplete="off" autofocus>
        <button class="send-btn" id="sendButton" onclick="sendMessage()">发送</button>
    </div>
    <!-- 表情面板 -->
    <div class="emoji-panel" id="emojiPanel" style="display:none">
        <div class="emoji-grid" id="emojiGrid"></div>
    </div>
</main>

<!-- 代码运行弹窗 -->
<div class="modal-overlay" id="codeModal" onclick="closeCodeModal(event)">
    <div class="modal-box" onclick="event.stopPropagation()">
        <div class="modal-header"><span>代码运行结果</span><button class="modal-close" onclick="closeCodeModal()">X</button></div>
        <pre class="modal-output" id="codeOutput"></pre>
    </div>
</div>

<!-- 自测弹窗 -->
<div class="modal-overlay" id="quizModal" onclick="closeQuizModal(event)">
    <div class="modal-box quiz-modal-box" onclick="event.stopPropagation()">
        <div class="modal-header">
            <span id="quizTitle">自测</span>
            <button class="modal-close" onclick="closeQuizModal()">X</button>
        </div>
        <div class="quiz-body" id="quizBody"></div>
        <div class="quiz-footer">
            <button class="quiz-submit-btn" id="quizSubmitBtn" onclick="submitQuiz()">提交</button>
        </div>
    </div>
</div>

</div>

<script>
// ================================================================
// 登录检查
// ================================================================
const USER_ID = parseInt(localStorage.getItem("user_id"));
const USERNAME = localStorage.getItem("username");
if (!USER_ID || !USERNAME) { location.href = "/"; }

document.getElementById("sidebarUsername").textContent = USERNAME;
let currentConvId = null;
let isSending = false;

// ================================================================
// 侧边栏
// ================================================================
function toggleSidebar() {
    document.getElementById("sidebar").classList.toggle("collapsed");
}

// 加载学习话题
async function loadTopics() {
    try {
        const r = await fetch("/api/topics"); const d = await r.json();
        document.getElementById("topicList").innerHTML = d.topics.map(t => `
            <div class="topic-item" onclick="showLesson('${t.icon}', '${t.q.replace(/'/g, "\\'")}')">
                <span class="topic-icon">${t.icon}</span>
                <div class="topic-info"><div class="topic-title">${t.title}</div><div class="topic-desc">${t.desc}</div></div>
            </div>`).join("");
    } catch(e) {}
}
loadTopics();

// 加载历史会话
async function loadConversations() {
    try {
        const r = await fetch(`/api/conversations?user_id=${USER_ID}`);
        const d = await r.json();
        const list = document.getElementById("convList");
        if (d.conversations.length === 0) {
            list.innerHTML = '<div class="topic-item" style="color:#6a8a6a;cursor:default">暂无历史对话</div>';
        } else {
            list.innerHTML = d.conversations.map(c => `
                <div class="conv-item ${c.id === currentConvId ? 'active' : ''}" onclick="selectConversation(${c.id})">
                    <span class="conv-title">${escHtml(c.title)}</span>
                    <span class="conv-del" onclick="event.stopPropagation();deleteConversation(${c.id})" title="删除">X</span>
                </div>`).join("");
        }
    } catch(e) {}
}

async function newConversation() {
    const r = await fetch("/api/conversations", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({user_id: USER_ID})
    });
    const d = await r.json();
    currentConvId = d.conversation_id;
    document.getElementById("chatContainer").innerHTML = "";
    showWelcome();
    loadConversations();
}

async function selectConversation(convId) {
    currentConvId = convId;
    await fetch(`/api/conversations/${convId}/select`, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({user_id: USER_ID})
    });
    // 加载历史消息
    const r = await fetch(`/api/conversations/${convId}/messages`);
    const d = await r.json();
    const container = document.getElementById("chatContainer");
    container.innerHTML = "";
    d.messages.forEach(m => {
        appendMsg(m.role, m.content);
    });
    // 渲染代码高亮
    container.querySelectorAll(".bot-msg .bubble").forEach(b => {
        applyHighlight(b); addCodeButtons(b);
    });
    container.scrollTop = container.scrollHeight;
    loadConversations();
}

async function deleteConversation(convId) {
    if (!confirm("确认删除此对话？")) return;
    await fetch(`/api/conversations/${convId}`, {method: "DELETE"});
    if (currentConvId === convId) { currentConvId = null; showWelcome(); }
    loadConversations();
}

function showWelcome() {
    document.getElementById("chatContainer").innerHTML = `
        <div class="welcome-card">
            <div class="welcome-icon" id="welcomeIcon"></div>
            <h2>你好！我是蟒蛇老师</h2>
            <p>你的专属 Python 编程教练，从零基础到进阶实战</p>
            <div class="welcome-actions">
                <span onclick="sendPreset('Python应该怎么安装？写第一个Hello World')">入门第一课</span>
                <span onclick="sendPreset('什么是变量？Python有哪些数据类型？')">变量和类型</span>
                <span onclick="sendPreset('带我写一个猜数字小游戏')">实战小游戏</span>
            </div>
        </div>`;
    document.getElementById("welcomeIcon").textContent = "\u{1F40D}";
}

function escHtml(s) { const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }

// ================================================================
// 教学知识点卡片
// ================================================================
async function showLesson(topicId, fallbackQ) {
    try {
        const r = await fetch(`/api/lessons?id=${topicId}`);
        const d = await r.json();
        if (!d.lesson) { sendPreset(fallbackQ); return; }
        const L = d.lesson;

        const card = document.createElement("div");
        card.className = "lesson-card";
        card.innerHTML = `
            <div class="lesson-header">
                <span class="lesson-badge">知识点 ${topicId}</span>
                <span class="lesson-title">${escHtml(L.title)}</span>
            </div>
            <div class="lesson-concept">${escHtml(L.concept)}</div>
            <div class="lesson-points">
                ${L.points.map(p => `<div class="lesson-point">  ${escHtml(p)}</div>`).join("")}
            </div>
            <div class="lesson-code-label"> 示例代码 <span class="lesson-code-hint">（可复制+运行）</span></div>
            <pre><code class="language-python">${escHtml(L.code)}</code></pre>
            <div class="lesson-actions">
                <button class="lesson-btn primary" onclick="sendPreset('${L.ask.replace(/'/g, "\\'")}')"> 让蟒蛇老师详细讲解</button>
                <button class="lesson-btn quiz-btn" onclick="openQuiz('${topicId}')"> 自测</button>
            </div>
        `;
        document.getElementById("chatContainer").appendChild(card);
        document.getElementById("chatContainer").scrollTop = document.getElementById("chatContainer").scrollHeight;

        // 代码高亮
        card.querySelectorAll("pre code").forEach(b => hljs.highlightElement(b));
        // 添加复制+运行按钮
        card.querySelectorAll("pre").forEach(pre => {
            const tb = document.createElement("div"); tb.className = "code-toolbar";
            tb.innerHTML = '<button class="code-btn copy-btn">复制</button><button class="code-btn run-btn">运行</button>';
            tb.querySelector(".copy-btn").onclick = () => {
                navigator.clipboard.writeText(pre.querySelector("code").textContent).then(() => {
                    tb.querySelector(".copy-btn").textContent = "已复制";
                    setTimeout(() => tb.querySelector(".copy-btn").textContent = "复制", 1500);
                });
            };
            tb.querySelector(".run-btn").onclick = () => runCode(pre.querySelector("code").textContent);
            pre.style.position = "relative"; pre.appendChild(tb);
        });
    } catch(e) { sendPreset(fallbackQ); }
}

// ================================================================
// 发送消息
// ================================================================
function sendPreset(q) { document.getElementById("messageInput").value = q; sendMessage(); }

async function sendMessage() {
    const message = document.getElementById("messageInput").value.trim();
    if (!message || isSending) return;
    isSending = true;

    // 自动创建会话
    if (!currentConvId) await newConversation();

    appendMsg("user", message);
    document.getElementById("messageInput").value = "";
    document.getElementById("sendButton").disabled = true;

    const contentDiv = createBotBubble();
    setStatus("思考中...", "loading");

    let pendingText = "", streamDone = false, cursor = 0, timer = null;

    function typeNext() {
        if (cursor < pendingText.length) {
            cursor++;
            contentDiv.textContent = pendingText.slice(0, cursor);
            document.getElementById("chatContainer").scrollTop = document.getElementById("chatContainer").scrollHeight;
            timer = setTimeout(typeNext, 22 + Math.random() * 30);
        } else if (streamDone) {
            clearTimeout(timer);
            contentDiv.innerHTML = formatMessage(pendingText);
            applyHighlight(contentDiv); addCodeButtons(contentDiv);
            document.getElementById("chatContainer").scrollTop = document.getElementById("chatContainer").scrollHeight;
            setStatus("就绪", "ready");
            isSending = false;
            document.getElementById("sendButton").disabled = false;
            document.getElementById("messageInput").focus();
            loadConversations();  // 刷新侧边栏标题
        } else {
            timer = setTimeout(typeNext, 50);
        }
    }
    timer = setTimeout(typeNext, 100);

    try {
        const resp = await fetch("/api/chat/stream", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({message, user_id: USER_ID, conversation_id: currentConvId})
        });
        const reader = resp.body.getReader();
        const decoder = new TextDecoder();
        let buf = "";
        while (true) {
            const {done, value} = await reader.read();
            if (done) break;
            buf += decoder.decode(value, {stream: true});
            const lines = buf.split("\n\n"); buf = lines.pop();
            for (const line of lines) {
                if (line.startsWith("data: ")) {
                    try {
                        const d = JSON.parse(line.slice(6));
                        if (d.status === "streaming") pendingText += d.chunk;
                        else if (d.status === "done") streamDone = true;
                        else if (d.status === "error") { pendingText += d.chunk; streamDone = true; }
                    } catch(e) {}
                }
            }
        }
    } catch(e) { if (!pendingText) pendingText = "网络连接错误"; streamDone = true; }
    streamDone = true;
}

// ================================================================
// 消息渲染
// ================================================================
function appendMsg(role, content) {
    const div = document.createElement("div");
    div.className = `msg ${role}-msg`;
    const av = role === "user" ? userAvatar : '\u{1F40D}';
    div.innerHTML = `<div class="avatar ${role}-av">${av}</div><div class="bubble">${escHtml(content)}</div>`;
    document.getElementById("chatContainer").appendChild(div);
    document.getElementById("chatContainer").scrollTop = document.getElementById("chatContainer").scrollHeight;
    return div;
}

function createBotBubble() {
    const div = document.createElement("div");
    div.className = "msg bot-msg";
    div.innerHTML = '<div class="avatar bot-av">\u{1F40D}</div><div class="bubble"></div>';
    document.getElementById("chatContainer").appendChild(div);
    return div.querySelector(".bubble");
}

// Markdown 格式化 + 高亮 + 代码按钮（同前）
function formatMessage(text) {
    if (!text) return "";
    const cbs = [];
    text = text.replace(/```(\w*)\r?\n?([\s\S]*?)```/g, (_, lang, code) => {
        cbs.push(code.trim()); return `\n%%CB${cbs.length - 1}%%\n`;
    });
    let html = text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    html = html.replace(/`([^`]+)`/g, "<code>$1</code>");
    html = html.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    html = html.replace(/%%CB(\d+)%%/g, (_, i) =>
        `<pre><code class="language-python">${cbs[parseInt(i)]}</code></pre>`);
    const parts = html.split(/(<pre><code[\s\S]*?<\/code><\/pre>)/g);
    return parts.map(p => {
        if (p.startsWith("<pre>")) return p;
        return p.split(/\n\n+/).map(x => x.trim()).filter(x => x)
            .map(x => `<p>${x.replace(/\n/g, "<br>")}</p>`).join("");
    }).join("");
}
function applyHighlight(el) { el.querySelectorAll("pre code").forEach(b => hljs.highlightElement(b)); }
function addCodeButtons(el) {
    el.querySelectorAll("pre").forEach(pre => {
        if (pre.querySelector(".code-toolbar")) return;
        const tb = document.createElement("div"); tb.className = "code-toolbar";
        tb.innerHTML = '<button class="code-btn copy-btn">复制</button><button class="code-btn run-btn">运行</button>';
        tb.querySelector(".copy-btn").onclick = () => {
            navigator.clipboard.writeText(pre.querySelector("code").textContent).then(() => {
                tb.querySelector(".copy-btn").textContent = "已复制";
                setTimeout(() => tb.querySelector(".copy-btn").textContent = "复制", 1500);
            });
        };
        tb.querySelector(".run-btn").onclick = () => runCode(pre.querySelector("code").textContent);
        pre.style.position = "relative"; pre.appendChild(tb);
    });
}

async function runCode(code) {
    document.getElementById("codeModal").classList.add("show");
    document.getElementById("codeOutput").textContent = "运行中...";
    try {
        const r = await fetch("/api/execute", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({code})});
        const d = await r.json();
        document.getElementById("codeOutput").textContent = (d.output||"") + (d.error?("\n[错误]\n"+d.error):"") || "(无输出)";
    } catch(e) { document.getElementById("codeOutput").textContent = "运行失败: "+e.message; }
}
function closeCodeModal(e) {
    if (e && e.target !== document.getElementById("codeModal")) return;
    document.getElementById("codeModal").classList.remove("show");
}

function setStatus(text, type) {
    const el = document.getElementById("topStatus");
    el.textContent = text; el.className = "topbar-status " + type;
}

document.getElementById("messageInput").addEventListener("keydown", e => {
    if (e.key === "Enter") sendMessage();
});

// ================================================================
// 加载用户头像
// ================================================================
let userAvatar = "\u{1F40D}";  // 默认值
async function loadUserAvatar() {
    try {
        const r = await fetch(`/api/profile?user_id=${USER_ID}`);
        const d = await r.json();
        if (d.profile && d.profile.avatar) {
            userAvatar = d.profile.avatar;
        }
        // 只更新侧边栏logo（用户自己的头像）
        const logo = document.getElementById("sidebarLogo");
        if (logo) logo.textContent = userAvatar;
        // 欢迎图标永远是蟒蛇老师 🐍
        const welcome = document.getElementById("welcomeIcon");
        if (welcome) welcome.textContent = "\u{1F40D}";
        document.querySelectorAll(".bot-av").forEach(el => {
            el.textContent = userAvatar;
        });
        document.querySelectorAll(".user-av").forEach(el => {
            el.textContent = "\u{1F464}";
        });
    } catch(e) {}
}

// ================================================================
// 表情面板
// ================================================================
const EMOJIS = [
    "😀","😂","🤣","😊","😍","🤔","😅","😢","😎","🥳",
    "👍","👎","👏","💪","🙏","❤","🔥","🎉","🌟","✨",
    "🐍","💻","📚","💡","✅","❌","⏰","🌈","🎵","🍵",
    "☕","🍰","🎂","🚀","⭐","🏆","💯","🤖","👋","😱",
    "🙂","😋","🤩","😤","🥺","😴","🤗","🫡","🙃","😜",
];

function buildEmojiGrid() {
    document.getElementById("emojiGrid").innerHTML = EMOJIS.map(e =>
        `<span class="emoji-item" onclick="insertEmoji('${e}')">${e}</span>`
    ).join("");
}

function toggleEmoji() {
    const panel = document.getElementById("emojiPanel");
    panel.style.display = panel.style.display === "none" ? "block" : "none";
}

function insertEmoji(emoji) {
    const inp = document.getElementById("messageInput");
    const pos = inp.selectionStart;
    const before = inp.value.substring(0, pos);
    const after = inp.value.substring(pos);
    inp.value = before + emoji + after;
    inp.focus();
    inp.selectionStart = inp.selectionEnd = pos + emoji.length;
}

// 点击其他区域关闭表情面板
document.addEventListener("click", e => {
    const panel = document.getElementById("emojiPanel");
    const btn = document.getElementById("emojiBtn");
    if (panel.style.display === "block" && e.target !== btn && !panel.contains(e.target)) {
        panel.style.display = "none";
    }
});

// ================================================================
// 初始化
// ================================================================
(function init() {
    loadUserAvatar();
    document.querySelectorAll(".topic-icon").forEach(el => {
        el.style.cssText = "display:inline-flex;align-items:center;justify-content:center;"
            + "width:24px;height:24px;border-radius:50%;background:#1e3a2a;color:#52b788;"
            + "font-size:11px;font-weight:700;flex-shrink:0;";
    });

    buildEmojiGrid();
})();

// ================================================================
// 自测功能
// ================================================================
let quizChapter = "";

async function openQuiz(chapter) {
    quizChapter = chapter;
    try {
        const r = await fetch(`/api/quiz/${chapter}`);
        const d = await r.json();
        if (!d.quiz) { alert("题目加载失败"); return; }

        document.getElementById("quizTitle").textContent = "自测 - " + d.quiz.title;
        const mcqCount = d.quiz.questions.length;
        const blanks = d.quiz.blanks || [];
        document.getElementById("quizBody").innerHTML =
            // 选择题
            d.quiz.questions.map((q, i) => `
            <div class="quiz-q">
                <div class="quiz-q-title">${i+1}. [选择] ${q.q}</div>
                <div class="quiz-opts">
                    ${q.opts.map((opt, j) => `
                        <label class="quiz-opt">
                            <input type="radio" name="q${i}" value="${j}"> ${opt}
                        </label>
                    `).join("")}
                </div>
            </div>
            `).join("") +
            // 填空题
            blanks.map((b, i) => `
            <div class="quiz-q">
                <div class="quiz-q-title">${mcqCount + i + 1}. [填空] ${b.q.replace(/____/g, '______')}</div>
                <input type="text" name="blank${i}" class="blank-input" placeholder="请输入答案" autocomplete="off">
            </div>
            `).join("");
        document.getElementById("quizSubmitBtn").style.display = "";
        document.getElementById("quizModal").classList.add("show");
    } catch(e) { alert("加载失败"); }
}

async function submitQuiz() {
    const answers = [];
    const blankAnswers = [];
    // 选择题
    const quizQs = document.querySelectorAll(".quiz-q");
    const mcqCount = quizQs.length - document.querySelectorAll(".blank-input").length;
    for (let i = 0; i < mcqCount; i++) {
        const sel = document.querySelector(`input[name="q${i}"]:checked`);
        answers.push(sel ? parseInt(sel.value) : -1);
    }
    // 填空题
    document.querySelectorAll(".blank-input").forEach(inp => {
        blankAnswers.push(inp.value.trim());
    });

    const r = await fetch("/api/quiz/submit", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({user_id: USER_ID, chapter: quizChapter, answers, blankAnswers})
    });
    const d = await r.json();

    document.getElementById("quizBody").innerHTML = `
        <div class="quiz-result">
            <div class="quiz-score">${d.score} / ${d.total}</div>
            <div class="quiz-breakdown">选择题 ${d.mcq_score}/${d.mcq_total}  +  填空题 ${d.blank_score}/${d.blank_total}</div>
            <div class="quiz-msg">${d.score >= d.total ? "全部正确！太棒了！" : d.score >= d.total*0.6 ? "不错！继续加油！" : "多做练习，再接再厉！"}</div>
            ${d.is_new_best ? '<div class="quiz-best">新纪录！历史最高分已更新</div>' : `<div class="quiz-best">历史最高分: ${d.best}/${d.total}</div>`}
        </div>
        <div class="quiz-detail">
            ${d.mcq_results.map((r, i) => `
                <div class="qd-item ${r.ok ? 'qd-ok' : 'qd-err'}">
                    <span class="qd-tag">${r.ok ? '对' : '错'}</span>
                    <span class="qd-label">选择${i+1}:</span> ${r.q}
                    ${!r.ok ? `<div class="qd-info">你的答案: ${r.user} | 正确答案: ${r.correct_ans}</div>` : ''}
                    ${!r.ok ? `<div class="qd-exp">${r.exp}</div>` : ''}
                </div>
            `).join("")}
            ${d.blank_results.map((r, i) => `
                <div class="qd-item ${r.ok ? 'qd-ok' : 'qd-err'}">
                    <span class="qd-tag">${r.ok ? '对' : '错'}</span>
                    <span class="qd-label">填空${i+1}:</span> ${r.q}
                    ${!r.ok ? `<div class="qd-info">你的答案: ${r.user} | 正确答案: ${r.correct_ans}</div>` : ''}
                    ${!r.ok ? `<div class="qd-exp">${r.exp}</div>` : ''}
                </div>
            `).join("")}
        </div>
    `;
    document.getElementById("quizSubmitBtn").style.display = "none";
}

function closeQuizModal(e) {
    if (e && e.target !== document.getElementById("quizModal")) return;
    document.getElementById("quizModal").classList.remove("show");
}
</script>
</body>
</html>
