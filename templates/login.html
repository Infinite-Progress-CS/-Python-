<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>蟒蛇老师教Python - 登录</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
    font-family: "Microsoft YaHei","PingFang SC",sans-serif;
    background: linear-gradient(135deg, #0d1f14 0%, #1b4332 50%, #2d6a4f 100%);
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
}
.login-card {
    background: #fff; border-radius: 20px; padding: 48px 40px;
    width: 400px; box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    text-align: center;
}
.login-logo { font-size: 56px; margin-bottom: 8px; }
.login-title { font-size: 24px; font-weight: 700; color: #1b4332; margin-bottom: 4px; }
.login-sub { font-size: 13px; color: #888; margin-bottom: 28px; }
.login-input {
    width: 100%; padding: 14px 18px; border: 2px solid #d8e2d4;
    border-radius: 12px; font-size: 16px; outline: none;
    text-align: center; transition: border 0.2s;
}
.login-input:focus { border-color: #52b788; }
.login-btn {
    width: 100%; padding: 14px; margin-top: 16px;
    background: #2d6a4f; color: #fff; border: none;
    border-radius: 12px; font-size: 17px; font-weight: 600;
    cursor: pointer; transition: background 0.2s;
}
.login-btn:hover { background: #1b4332; }
.login-hint { font-size: 12px; color: #aaa; margin-top: 16px; }
.error-msg { color: #d32f2f; font-size: 13px; margin-top: 8px; display: none; }
</style>
</head>
<body>
<div class="login-card">
    <div class="login-logo" id="logo"></div>
    <div class="login-title">蟒蛇老师教Python</div>
    <div class="login-sub">输入用户名，开始你的Python学习之旅</div>
    <input type="text" class="login-input" id="username" placeholder="输入用户名" autofocus maxlength="20">
    <input type="password" class="login-input" id="password" placeholder="输入密码（新用户即注册）" maxlength="20" style="margin-top:10px;">
    <button class="login-btn" onclick="doLogin()">进入课堂</button>
    <div class="error-msg" id="error"></div>
    <div class="login-hint">新用户自动注册 · 老用户验证密码登录</div>
</div>
<script>
document.getElementById("logo").textContent = "\u{1F40D}";
document.getElementById("username").addEventListener("keydown", e => {
    if (e.key === "Enter") document.getElementById("password").focus();
});
document.getElementById("password").addEventListener("keydown", e => {
    if (e.key === "Enter") doLogin();
});
async function doLogin() {
    const name = document.getElementById("username").value.trim();
    const pwd = document.getElementById("password").value.trim();
    if (!name) { showError("请输入用户名"); return; }
    if (name.length < 2) { showError("用户名至少2个字符"); return; }
    if (!pwd) { showError("请输入密码"); return; }
    if (pwd.length < 3) { showError("密码至少3位"); return; }
    try {
        const resp = await fetch("/api/login", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({username: name, password: pwd})
        });
        const data = await resp.json();
        if (data.status === "ok") {
            localStorage.setItem("user_id", data.user_id);
            localStorage.setItem("username", data.username);
            window.location.href = "/chat";
        } else {
            showError(data.error || "登录失败");
        }
    } catch(e) { showError("网络错误"); }
}
function showError(msg) {
    const el = document.getElementById("error");
    el.textContent = msg; el.style.display = "block";
}
</script>
</body>
</html>
